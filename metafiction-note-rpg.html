function say(ch,txt,opts=[]){chapter.textContent=ch;textEl.textContent=txt;choices.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.t;b.onclick=o.f;choices.append(b)});next.style.display=opts.length?'none':'block'}
function log(t){const d=document.createElement('div');d.textContent=t;document.getElementById('log').prepend(d)}
function update(){document.getElementById('readStat').textContent=read;document.getElementById('readBar').style.width=Math.min(100,read*10)+'%';document.getElementById('selfStat').textContent=self;document.getElementById('selfBar').style.width=self+'%'}
function start(){
  setArt('city');
  say('序章　noteの街','彼は小説を書いていた。\n誰にも読まれることのなかった物語を、私は世界に還すことにした。\nnoteという扉を開く。',[
    {t:'Pochi と入力する',f:()=>openCity(false)},
    {t:'先に彼の小説を読む',f:()=>{read++;update();log('物語を先に読んだ　読解力 +1');openCity(true)}}
  ]);
}
function openCity(readFirst){
  log('アカウント Pochi が登録された');
  document.getElementById('item').textContent='Pochiのノート';
  setArt('city');
  const intro=readFirst?'読んでから、noteという扉を開く。\nショーウィンドウの奥で、マネキンがこちらを見ていた。':'無関心なサムネイルが並ぶ。マネキンたちは、こちらを恨めしそうに眺めている。\n読むほどに、街の輪郭が見えてきた。';
  say('第一階層　ショーウィンドウ',intro,[
    {t:'近づいて、文章を読む',f:beginBattle},
    {t:'視線を避けて街の奥へ進む',f:()=>{self=Math.max(0,self-8);update();log('視線を避けた　自意識 -8');tower()}}
  ]);
}
function beginBattle(){
  combat=true;enemy=6;
  document.getElementById('combatUI').classList.add('on');
  document.getElementById('dragbox').classList.add('on');
  document.getElementById('enemyName').textContent='無関心なマネキン';
  document.getElementById('enemyNum').textContent=enemy;
  document.getElementById('enemyBar').style.width='100%';
  document.getElementById('dragLabel').textContent='「……。」';
  document.getElementById('dragHelp').textContent='押したまま画面をドラッグ。指を離すと、溜めたポイントで攻撃。';
  document.getElementById('dragMeter').style.width='0%';
  setArt('battle');
  say('戦闘　読む／返す','マネキンは何も言わない。\n画面をドラッグして言葉を引き寄せ、指を離して攻撃する。');
  next.style.display='none';log('無関心なマネキンが現れた');
}
const box=document.getElementById('dragbox');
let lastX=0,lastY=0,dragDistance=0;
box.addEventListener('pointerdown',e=>{
  if(!combat)return;
  e.preventDefault();charging=true;gauge=0;dragDistance=0;lastX=e.clientX;lastY=e.clientY;
  box.setPointerCapture(e.pointerId);box.classList.add('charging');
  document.getElementById('dragMeter').style.width='0%';
  document.getElementById('dragLabel').textContent='0 ポイント';
});
box.addEventListener('pointermove',e=>{
  if(!combat||!charging)return;
  e.preventDefault();
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  dragDistance+=Math.hypot(dx,dy);lastX=e.clientX;lastY=e.clientY;
  gauge=Math.min(100,dragDistance/2.5);
  document.getElementById('dragMeter').style.width=gauge+'%';
  document.getElementById('dragLabel').textContent=Math.floor(gauge)+' ポイント';
});
function release(){
  if(!charging)return;
  charging=false;box.classList.remove('charging');
  if(!combat)return;
  if(gauge<5){
    document.getElementById('toast').textContent='画面をドラッグしてポイントを溜める';
    document.getElementById('toast').classList.remove('show');void document.getElementById('toast').offsetWidth;document.getElementById('toast').classList.add('show');
    document.getElementById('dragLabel').textContent='言葉をつかんでドラッグ';return;
  }
  const damage=Math.min(3,1+Math.floor(gauge/34));
  enemy=Math.max(0,enemy-damage);
  document.getElementById('enemyNum').textContent=enemy;
  document.getElementById('enemyBar').style.width=(enemy/6*100)+'%';
  read++;update();
  document.getElementById('toast').textContent=gauge>=68?'強く言葉を返した　− '+damage:'言葉が返る　− '+damage;
  document.getElementById('toast').classList.remove('show');void document.getElementById('toast').offsetWidth;document.getElementById('toast').classList.add('show');
  document.getElementById('flash').classList.add('on');setTimeout(()=>document.getElementById('flash').classList.remove('on'),350);
  log(Math.floor(gauge)+'ポイントを攻撃に変えた　'+damage+'ダメージ');
  setTimeout(()=>{if(combat){document.getElementById('dragMeter').style.width='0%';document.getElementById('dragLabel').textContent='言葉をつかんでドラッグ';}},450);
  if(enemy<=0){
    combat=false;document.getElementById('combatUI').classList.remove('on');box.classList.remove('on');setArt('city');
    say('読まれた気配','ピコン。\n「スキしてくれました。」\nキスと見間違えて、少し恥ずかしい。\n亡霊は、仮初めの愛を受けて蘇るのかもしれない。');
    next.onclick=()=>tower();
  }
}
box.addEventListener('pointerup',release);box.addEventListener('pointercancel',release);
function tower(){
  setArt('tower');
  say('第二階層　天狗の塔','「コメントをもらうには、どうしたら良いのでしょう」\n空を飛ぶ天狗は、あなたの言葉を待っている。',[
    {t:'制作秘話を書く',f:()=>towerReply(0)},
    {t:'コメントが欲しいと正直に書く',f:()=>towerReply(1)},
    {t:'誰かの日記にコメントを返す',f:()=>towerReply(2)}
  ]);
}
function towerReply(kind){
  read++;update();setArt('tower');
  const replies=[
    '「作品にはコメントしにくいですね。日記や制作秘話を書いてみては」\n\n正直なところを読むと、親近感が持ててコメントしやすい。',
    '「コメントが欲しい」\n書いてしまうと、少しだけ胸が軽くなった。\n\n心を開くのは勇気が要る。',
    '誰かの文章を読み、短い感想を返した。\n\nやさしい言葉が返ってくる。相手の存在が少し近くなる。'
  ];
  const labels=['制作秘話を残した','欲しいものを言葉にした','読者へ言葉を返した'];
  if(kind===1)self=Math.max(0,self-5);else self=Math.min(100,self+3);
  update();log(labels[kind]);
  say('小さな返事',replies[kind]);
  next.onclick=()=>choiceTower();
}
function choiceTower(){
  setArt('tower');
  say('第三階層　ふたつの手','左手には、フレンチドレッシングの作り方。\n右手には、彼女の居場所が書かれた紙。\nあなたは、どちらを取る？',[
    {t:'左手のレシピを取る',f:()=>enterRoom('recipe')},
    {t:'右手の紙を取る',f:()=>enterRoom('place')},
    {t:'どちらにも手を伸ばさない',f:()=>enterRoom('none')}
  ]);
}
function enterRoom(route){
  setArt('room');
  let line='';
  if(route==='recipe'){document.getElementById('item').textContent='ドレッシングの作り方';read++;line='紙には、油と酢と塩の分量だけが書かれていた。';log('左手のレシピを選んだ');}
  if(route==='place'){document.getElementById('item').textContent='彼女の居場所';self=Math.min(100,self+5);line='紙を開く。\nそこに書かれた場所へ、本当に行くのだろうか。';log('右手の紙を選んだ');}
  if(route==='none'){read++;line='どちらも取らなかった。\n答えを選ばないことも、ひとつの読み方だった。';log('どちらにも手を伸ばさなかった');}
  update();
  say('夜の部屋',line+'\n\n彼女のいる世界。彼女のいない街。',[{t:'部屋の静けさに耳をすます',f:ending}]);
}
function ending(){
  combat=false;box.classList.remove('on');document.getElementById('combatUI').classList.remove('on');
  setArt('door');
  say('','これで佳しとする。\n\nおしまい。');
  next.style.display='none';
  setTimeout(()=>{
    const d=document.getElementById('endDoor');if(d)d.classList.add('open');
    const w=document.getElementById('endFigure');if(w)w.classList.add('show');
    const glow=document.getElementById('doorGlow');if(glow)glow.style.opacity='.9';
    const dlg=document.querySelector('.dialog');dlg.style.transition='opacity .7s';dlg.style.opacity='0';
    setTimeout(()=>{dlg.style.opacity='1';textEl.textContent='ガチャ';},1200);
    setTimeout(()=>{dlg.style.opacity='0';setTimeout(()=>{dlg.style.opacity='1';textEl.textContent='';},900)},2500);
  },2300);
  setTimeout(()=>{
    if(document.querySelector('.choices .replay'))return;
    const restart=document.createElement('button');restart.className='choice replay';restart.textContent='もう一度読む';restart.onclick=()=>location.reload();
    choices.append(restart);
  },5800);
}
next.onclick=()=>{if(scene===0)start()};
say('metafiction:note','誰にも読まれなかった物語を、世界に還す。\n\n読むたびに少しずつ姿を変える、小さなRPG。',[{t:'はじめる',f:start}]);setArt('city');
</script></body></html>
